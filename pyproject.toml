[project]
name = "rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation system for codebases"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "fire",
    "bm25s",
    "tqdm",
    "flake8",
    "mypy",
    "transformers",
    "torch"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
